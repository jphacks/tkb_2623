name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run GourmetShareMapTests
    # xcode-27 runner image (GA since 2026-10-15): macOS 27 + Xcode 27.0/27.1/27.2(beta), Apple Silicon only.
    # https://github.blog/changelog/2026-10-15-xcode-27-runner-image-generally-available/
    runs-on: xcode-27
    env:
      # 開発で使用しているXcode 27.1 (Build 27A9275) に明示的に固定する。
      # イメージのデフォルトは27.0のため、何も指定しないとバージョンがずれる。
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode & Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/GourmetShareMap-Shared/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('GourmetShareMap.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Create dummy secret config files
        # GourmetShareMap/Supabase/SupabaseConfig.swift と
        # GourmetShareMap/Services/Places/GoogleMapsConfig.swift は
        # .gitignore 対象のため、CIのチェックアウトには存在しない。
        # 既存のユニットテストはすべてURLProtocolモックで実ネットワークに
        # 依存しないため、リポジトリに同梱されている *.swift.example の
        # プレースホルダ値をそのままコピーすればビルド・テストが通る。
        run: |
          cp GourmetShareMap/Supabase/SupabaseConfig.swift.example \
             GourmetShareMap/Supabase/SupabaseConfig.swift
          cp GourmetShareMap/Services/Places/GoogleMapsConfig.swift.example \
             GourmetShareMap/Services/Places/GoogleMapsConfig.swift

      - name: Run GourmetShareMapTests
        run: |
          xcodebuild test \
            -project GourmetShareMap.xcodeproj \
            -scheme GourmetShareMap \
            -only-testing:GourmetShareMapTests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData/GourmetShareMap-Shared
